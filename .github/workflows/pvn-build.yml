name: PVN Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  QT_VERSION: 6.10.1
  QIF_VERSION: 4.7
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/
  PROD_AGW_PUBLIC_KEY: ""
  PROD_S3_ENDPOINT: ""
  FALLBACK_S3_ENDPOINT: ""
  DEV_AGW_PUBLIC_KEY: ""
  DEV_AGW_ENDPOINT: ""
  DEV_S3_ENDPOINT: ""
  FREE_V2_ENDPOINT: ""
  PREM_V1_ENDPOINT: ""

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan==2.28.0"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtremoteobjects qt5compat qtshadertools qtmultimedia qtimageformats qtquick3d
          tools: tools_ifw
          dir: ${{ runner.temp }}
          setup-python: false
          set-env: true
          aqtversion: "==3.3.0"
          extra: --base ${{ env.QT_MIRROR }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build PVN + Installer
        shell: cmd
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}/Qt
        run: |
          call deploy\build.bat -arch x64 --installer ifw

      - name: Upload exe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PVN-windows-x64-exe
          path: deploy/build/client/Release/PVN.exe
          if-no-files-found: warn

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PVN-windows-x64-installer
          path: |
            deploy/build/*.exe
            deploy/build/*.msi
            deploy/build/*Setup*
            deploy/build/PVN-*
          if-no-files-found: warn

      - name: Upload full build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PVN-windows-build-logs
          path: |
            deploy/build/CMakeCache.txt
            deploy/build/CMakeFiles/CMakeError.log
            deploy/build/CMakeFiles/CMakeOutput.log
          if-no-files-found: warn
          retention-days: 7

  build-android:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Conan
        run: pip install "conan==2.28.0"

      - name: Install Qt for host (Linux)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtremoteobjects qt5compat qtshadertools
          dir: ${{ runner.temp }}/qt-host
          setup-python: false
          aqtversion: "==3.3.0"
          extra: --base ${{ env.QT_MIRROR }}

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_${{ matrix.abi == 'arm64-v8a' && 'arm64_v8a' || (matrix.abi == 'armeabi-v7a' && 'armv7' || 'x86_64') }}
          modules: qtremoteobjects qt5compat qtshadertools qtmultimedia qtimageformats qtquick3d
          dir: ${{ runner.temp }}/qt-android
          setup-python: false
          set-env: true
          aqtversion: "==3.3.0"
          extra: --base ${{ env.QT_MIRROR }}

      - name: Build PVN APK (${{ matrix.abi }})
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
          QT_INSTALL_DIR: ${{ runner.temp }}/qt-android
        run: |
          set -e
          export QT_HOST_PATH="${RUNNER_TEMP}/qt-host/Qt/${QT_VERSION}/gcc_64"
          bash deploy/build.sh -t android --abi "$ABI"

      - name: Decode signing keystore
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/pvn.keystore

      - name: Sign APK
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -e
          APK_DIR=deploy/build/client/android-build/build/outputs/apk/release
          UNSIGNED="$APK_DIR/android-build-release-unsigned.apk"
          SIGNED="$APK_DIR/PVN-${ABI}-release.apk"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -p -v 4 "$UNSIGNED" "$SIGNED.aligned"
          "$BUILD_TOOLS/apksigner" sign \
            --ks ${{ runner.temp }}/pvn.keystore \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            --out "$SIGNED" \
            "$SIGNED.aligned"
          rm -f "$SIGNED.aligned"
          "$BUILD_TOOLS/apksigner" verify "$SIGNED"
          ls -la "$APK_DIR/"

      - name: Upload signed APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PVN-android-${{ matrix.abi }}
          path: deploy/build/client/android-build/build/outputs/apk/release/PVN-*-release.apk
          if-no-files-found: warn
