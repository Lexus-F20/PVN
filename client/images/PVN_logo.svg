<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141A2E"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </radialGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#00C2FF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00C2FF" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="380" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.55"/>
  <circle cx="512" cy="512" r="320" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.35"/>
  <text x="512" y="600" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Arial, sans-serif"
        font-weight="900"
        font-size="280"
        letter-spacing="6"
        fill="url(#text)"
        filter="url(#glow)">PVN</text>
</svg>
